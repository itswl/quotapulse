# QuotaPulse with Docker Compose. This file is all a host needs:
#
#   docker compose up -d
#
# then open http://<this machine>:8080 and choose a password: a new install
# asks it, its language and its time zone in the dashboard. A .env next to
# this file is read when there is one, and nothing in it is required (see
# .env.example).
#
# It runs the published image's 1.x line: a pull brings the newest 1.x, never
# a 2.0 that changes things you did not choose. To hold one release, set
# QUOTAPULSE_VERSION in .env.
#
# Everything QuotaPulse knows lives in ./data: the database, its daily
# backups, and the key that encrypts stored credentials. Back that directory up.
#
# To build from a checkout instead:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build

services:
  quotapulse:
    # QUOTAPULSE_IMAGE replaces the whole reference: a fork, a mirror.
    image: ${QUOTAPULSE_IMAGE:-ghcr.io/itswl/quotapulse:${QUOTAPULSE_VERSION:-1}}
    container_name: quotapulse
    restart: unless-stopped
    # It starts as root only to take ./data over — Docker makes a missing
    # directory as root — and then runs as whoever owns it: 65532, the
    # image's own user, for a new one. QUOTAPULSE_USER, a "uid:gid" in .env,
    # starts it as that user instead.
    user: "${QUOTAPULSE_USER:-0:0}"
    ports:
      # Put a TLS-terminating proxy in front before exposing this beyond the
      # machine. With one on the same host, publish to loopback only:
      # QUOTAPULSE_PORT=127.0.0.1:8080 in .env.
      - "${QUOTAPULSE_PORT:-8080}:8080"
    volumes:
      - ./data:/data
    env_file:
      - path: .env
        required: false
