# QuotaPulse with Docker Compose. This file and a .env are all a host needs.
#
#   echo "QUOTAPULSE_PASSWORD=choose-one" > .env
#   mkdir -p data && sudo chown 65532:65532 data
#   docker compose up -d
#
# It runs the published image. Pin a release with QUOTAPULSE_VERSION in .env,
# so that a pull never changes what is running behind your back.
#
# Everything QuotaPulse knows lives in ./data: the database, its daily
# backups, and the key that encrypts stored credentials. Back that directory up.
#
# To build from a checkout instead:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build

services:
  quotapulse:
    # QUOTAPULSE_IMAGE replaces the whole reference: a fork, a mirror.
    image: ${QUOTAPULSE_IMAGE:-ghcr.io/itswl/quotapulse:${QUOTAPULSE_VERSION:-latest}}
    container_name: quotapulse
    restart: unless-stopped
    # The image runs as 65532. With ./data owned by you instead, set
    # QUOTAPULSE_USER to your own "uid:gid" in .env.
    user: "${QUOTAPULSE_USER:-65532:65532}"
    ports:
      # Put a TLS-terminating proxy in front before exposing this beyond the
      # machine. With one on the same host, publish to loopback only:
      # QUOTAPULSE_PORT=127.0.0.1:8080 in .env.
      - "${QUOTAPULSE_PORT:-8080}:8080"
    volumes:
      - ./data:/data
    env_file:
      - path: .env
        required: false
