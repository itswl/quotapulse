name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      - name: Go tests
        run: go test -race ./...
        env:
          TZ: Asia/Shanghai

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: UI checks
        run: |
          npm --prefix ui ci
          npm --prefix ui run typecheck
          npm --prefix ui test

      - name: UI build is reproducible
        run: |
          npm --prefix ui run build
          if ! git diff --quiet -- ui/dist; then
            echo 'ui/dist changed after build; commit the generated output' >&2
            git diff --stat -- ui/dist >&2
            exit 1
          fi
