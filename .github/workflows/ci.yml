name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Real MySQL and PostgreSQL: sqlc generates one dialect per engine and the
    # store suite runs the same assertions on each when these URLs are set, so
    # dialect drift fails here instead of in production.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: quotapulse_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quotapulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      - name: Go tests
        run: go test -race ./...
        env:
          TZ: Asia/Shanghai
          STORE_TEST_MYSQL_URL: mysql://root:root@127.0.0.1:3306/quotapulse_test?charset=utf8mb4
          STORE_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/quotapulse_test?sslmode=disable

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: UI checks
        run: |
          npm --prefix ui ci
          npm --prefix ui run typecheck
          npm --prefix ui test

      - name: UI build is reproducible
        run: |
          npm --prefix ui run build
          if ! git diff --quiet -- ui/dist; then
            echo 'ui/dist changed after build; commit the generated output' >&2
            git diff --stat -- ui/dist >&2
            exit 1
          fi
