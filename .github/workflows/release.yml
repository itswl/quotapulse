# Implementation note.
#
#   git tag v1.2.3 && git push origin v1.2.3
#
# Implementation note.
# Implementation note.
name: release

on:
  push:
    tags:
      - "v*"
  # Implementation note.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Implementation note.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Localized message
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Localized messageNo Localized message�Localized message" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - run: go vet ./...

      # Implementation note.
      # Implementation note.
      - name: Localized message
        run: go test -race ./...
        env:
          TZ: Asia/Shanghai

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Localized message
        run: |
          npm --prefix ui ci
          npm --prefix ui run typecheck
          npm --prefix ui test

      # Implementation note.
      # Implementation note.
      - name: Localized message
        run: |
          npm --prefix ui run build
          if ! git diff --quiet -- ui/dist; then
            echo "ui/dist Localized message�Localized message npm --prefix ui run build Localized message�Localized message" >&2
            git diff --stat -- ui/dist >&2
            exit 1
          fi

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Localized message ghcr
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          # Implementation note.
          flavor: |
            latest=auto

      # Implementation note.
      # Implementation note.
      - name: Localized message
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Localized message
        if: github.event_name == 'push'
        run: |
          {
            echo "### Localized messageAlready Localized message"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Localized message�Localized message\`${{ github.ref_name }}\`�Localized message /health Localized message�Localized message"
          } >> "$GITHUB_STEP_SUMMARY"

  # Publishes the GitHub Release for a tag. There is nothing to build here — the changelog is
  # generated from the commits since the previous release — but it waits for the image job so
  # the notes never announce a container that failed to build.
  release:
    needs: [test, image]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # A tag can already carry a hand-written release; creating another would fail, so leave
      # the existing one untouched.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; leaving it as it is"
            exit 0
          fi
          # The image tag drops the leading v: git gets v0.1.9, the registry gets 0.1.9.
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --notes "Container image: \`${IMAGE}:${version}\` (also \`latest\`), linux/amd64 + linux/arm64."
