# Release on a tag: run the tests, build the multi-arch image, push it to ghcr.
#
#   git tag v1.2.3 && git push origin v1.2.3
#
# The image is published under this repository's name on ghcr.io, tagged 1.2.3 / 1.2 / 1 /
# latest (no leading v). A pre-release with a suffix (v1.2.3-rc1) leaves latest alone.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # The tests gate the release: once an image is pushed anyone may pull and run it, so
  # nothing unverified goes out.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - run: go vet ./...

      # -race matters: the dashboard state is read and written by the scheduler and the
      # HTTP handlers at the same time. Races only show up now and then locally, so they
      # are checked on every release.
      - name: Go tests
        run: go test -race ./...
        env:
          TZ: Asia/Shanghai

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: UI checks
        run: |
          npm --prefix ui ci
          npm --prefix ui run typecheck
          npm --prefix ui test

      # The committed dist must match the source, or the image embeds a stale page, and
      # nobody notices until someone opens the dashboard.
      - name: UI build is reproducible
        run: |
          npm --prefix ui run build
          if ! git diff --quiet -- ui/dist; then
            echo "ui/dist does not match the source; run npm --prefix ui run build locally and commit the result:" >&2
            git diff --stat -- ui/dist >&2
            exit 1
          fi

  image:
    needs: test
    if: ${{ github.event.created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          # A pre-release (v1.2.3-rc1) must not overwrite latest.
          flavor: |
            latest=auto

      # No QEMU needed: the Go stage cross-compiles with --platform=$BUILDPLATFORM plus
      # GOOS/GOARCH, and the frontend stage is pinned to the build machine as well, so both
      # run at native speed.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: github.event_name == 'push'
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Version: \`${{ github.ref_name }}\` (the binary reports this in /health)"
          } >> "$GITHUB_STEP_SUMMARY"

  # Publishes the GitHub Release for a tag. There is nothing to build here — the changelog is
  # generated from the commits since the previous release — but it waits for the image job so
  # the notes never announce a container that failed to build.
  release:
    needs: [test, image]
    if: github.event.created
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # A tag can already carry a hand-written release; creating another would fail, so leave
      # the existing one untouched.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; leaving it as it is"
            exit 0
          fi
          # The image tag drops the leading v: git gets v0.1.9, the registry gets 0.1.9.
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --notes "Container image: \`${IMAGE}:${version}\` (also \`latest\`), linux/amd64 + linux/arm64."
