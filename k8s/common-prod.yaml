# Production deployment manifest (namespace: common-prod)
#
# Replace two placeholders before applying:
#   YOUR_REGISTRY  image registry, e.g. registry.<region>.aliyuncs.com/<namespace>
#   YOUR_DOMAIN    public domain; appears once as the Ingress host and once as the TLS Secret name
#
# Also confirm .env carries WEB_API_KEY, DATABASE_URL and the provider credentials
# the project_config rows need, then create the Secret:
#
# kubectl create secret generic quotapulse-secret \
#   --from-env-file=.env \
#   -n common-prod \
#   --dry-run=client -o yaml | kubectl apply -f -
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quotapulse
  namespace: common-prod
  labels:
    app: quotapulse
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: quotapulse
  template:
    metadata:
      labels:
        app: quotapulse
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: quotapulse
          image: YOUR_REGISTRY/quotapulse
          imagePullPolicy: Always
          ports:
            - name: web
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9100
              protocol: TCP

          env:
            - name: TZ
              value: "Asia/Shanghai"
            - name: ENABLE_WEB_ALARM
              value: "false"
            - name: ENABLE_DATABASE
              value: "true"
            - name: ENABLE_DYNAMIC_CONFIG
              value: "true"
            - name: BALANCE_REFRESH_INTERVAL_SECONDS
              value: "3600"
            # In-process scheduled jobs (per the TZ timezone): real alert checks and mailbox scan times
            - name: ALERT_SCHEDULE
              value: "09:00,15:00"
            - name: EMAIL_SCAN_SCHEDULE
              value: "10:00"
            # The prometheus.io/scrape annotation requires actually exposing the metrics port
            - name: ENABLE_PROMETHEUS
              value: "true"
            - name: MAX_CONCURRENT_CHECKS
              value: "5"
            # Keep serving 15s after SIGTERM so endpoints drain. The image is scratch-based
            # with no shell for a preStop sleep; the program handles it itself.
            - name: SHUTDOWN_DELAY_SECONDS
              value: "15"
            - name: WEB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: quotapulse-secret
                  key: WEB_API_KEY
                  optional: false

          envFrom:
            - secretRef:
                name: quotapulse-secret
                optional: false

          volumeMounts:
            - name: logs
              mountPath: /app/logs

          resources:
            requests:
              memory: "48Mi"
              cpu: "50m"
            limits:
              memory: "192Mi"
              cpu: "500m"

          livenessProbe:
            httpGet:
              path: /live
              port: web
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: web
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 2

          startupProbe:
            httpGet:
              path: /live
              port: web
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 12

      volumes:
        - name: logs
          emptyDir: {}

      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: quotapulse
  namespace: common-prod
  labels:
    app: quotapulse
spec:
  type: ClusterIP
  ports:
    - name: web
      port: 8080
      targetPort: web
      protocol: TCP
    - name: metrics
      port: 9100
      targetPort: metrics
      protocol: TCP
  selector:
    app: quotapulse
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quotapulse
  namespace: common-prod
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-http01"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - quotapulse.YOUR_DOMAIN
      secretName: tls-quotapulse-YOUR_DOMAIN
  rules:
    - host: quotapulse.YOUR_DOMAIN
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: quotapulse
                port:
                  number: 8080
